# Nginx config snippet for the ShipShape dashboard.
# Append to the existing /etc/nginx/sites-available/ship server block
# (inside the `server { listen 80; … }` block, alongside the existing
# `location /`, `location /api/`, etc.).
#
# After installing:
#   sudo nginx -t && sudo systemctl reload nginx

location /dashboard/ {
    alias /opt/ship/dashboard/;
    try_files $uri $uri/ /dashboard/index.html;

    # Long-cache hashed assets (Vite-generated *-<hash>.js / *-<hash>.css).
    location ~* /dashboard/assets/.+\.(js|css|woff2|svg)$ {
        alias /opt/ship/dashboard/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
